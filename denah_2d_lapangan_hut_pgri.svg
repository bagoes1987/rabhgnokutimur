<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1020" class="w-full max-w-[480px] h-auto select-none drop-shadow-2xl">
          <defs>
            <pattern id="chairGrid" width="10" height="8" patternUnits="userSpaceOnUse">
              <rect width="7" height="6" rx="1.5" fill="#334155" opacity="0.65" />
            </pattern>
            <pattern id="upperChairGrid" width="10" height="8" patternUnits="userSpaceOnUse">
              <rect width="7" height="6" rx="1.5" fill="#38bdf8" opacity="0.3" />
            </pattern>
            <linearGradient id="carpetGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#dc2626" />
              <stop offset="100%" stop-color="#991b1b" />
            </linearGradient>
            <linearGradient id="ledGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#0284c7" />
              <stop offset="50%" stop-color="#38bdf8" />
              <stop offset="100%" stop-color="#0284c7" />
            </linearGradient>
          </defs>

          <!-- Indikator Ukuran 22 Meter (Atas) -->
          <line x1="30" y1="35" x2="410" y2="35" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4" />
          <text x="220" y="26" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">LEBAR LAPANGAN: 22 METER</text>

          <!-- Indikator Ukuran 60 Meter (Kanan) -->
          <line x1="425" y1="50" x2="425" y2="750" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4" />
          <text x="435" y="400" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(90, 435, 400)">PANJANG LAPANGAN UTAMA: 60 METER</text>

          <!-- AREA LAPANGAN UTAMA (22 x 60 M) -->
          <rect x="30" y="50" width="380" height="700" fill="#0b1120" stroke="#334155" stroke-width="2" rx="6" />

          <!-- ================= 1. PANGGUNG DEPAN ================= -->
          <!-- Panggung Utama (8m x 6m) -->
          <rect x="150" y="60" width="140" height="75" fill="#1e293b" stroke="#10b981" stroke-width="2.5" rx="4" />
          <text x="220" y="90" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">PANGGUNG UTAMA</text>
          <text x="220" y="105" fill="#cbd5e1" font-size="9" text-anchor="middle">8 × 6 M (Tinggi 1,2 M)</text>

          <!-- Videotron LED 8x3m di backdrop belakang panggung utama -->
          <rect x="155" y="62" width="130" height="13" fill="url(#ledGrad)" stroke="#38bdf8" stroke-width="1" rx="2" />
          <text x="220" y="72" fill="#082f49" font-size="8" font-weight="extrabold" text-anchor="middle">VIDEOTRON LED 8 × 3 M</text>

          <!-- Control Room (Kiri: 5m x 4m) -->
          <rect x="40" y="60" width="95" height="55" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" rx="4" />
          <text x="87" y="85" fill="#c7d2fe" font-size="10" font-weight="bold" text-anchor="middle">CONTROL ROOM</text>
          <text x="87" y="98" fill="#818cf8" font-size="8" text-anchor="middle">5 × 4 M (Mixer/LED/MC)</text>

          <!-- Panggung Paduan Suara (Kanan: 6m x 4m) -->
          <rect x="305" y="60" width="95" height="58" fill="#14532d" stroke="#22c55e" stroke-width="1.5" rx="4" />
          <text x="352" y="82" fill="#bbf7d0" font-size="10" font-weight="bold" text-anchor="middle">PADUAN SUARA</text>
          <text x="352" y="94" fill="#4ade80" font-size="8" text-anchor="middle">6 × 4 M (Trap 3 Level)</text>
          <text x="352" y="107" fill="#86efac" font-size="8" font-weight="bold" text-anchor="middle">⬇ HADAP PESERTA</text>

          <!-- Buffer Area Tari Sambut &amp; Pers (Clearance 4 meter) -->
          <rect x="40" y="145" width="360" height="35" fill="#0f172a" stroke="#475569" stroke-dasharray="3" rx="2" />
          <text x="220" y="167" fill="#64748b" font-size="9" text-anchor="middle">AREA TARI SAMBUT &amp; PERS (BUFFER 4 M)</text>

          <!-- ================= 2. JALUR LORONG TENGAH (RED CARPET) ================= -->
          <rect x="200" y="180" width="40" height="565" fill="url(#carpetGrad)" stroke="#ef4444" stroke-width="1" />
          <text x="220" y="450" fill="#fecaca" font-size="9" font-weight="bold" text-anchor="middle" transform="rotate(90, 220, 450)">LORONG UTAMA (RED CARPET LEBAR 2,5 M)</text>

          <!-- ================= 3. ZONA VVIP &amp; VIP (Baris Depan) ================= -->
          <!-- VVIP Kiri: Bupati -->
          <rect x="50" y="190" width="140" height="40" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" rx="4" />
          <text x="120" y="206" fill="#fde68a" font-size="8.5" font-weight="bold" text-anchor="middle">SOFA VVIP BUPATI &amp; FORKOPIMDA</text>
          <text x="120" y="217" fill="#fcd34d" font-size="7" text-anchor="middle">Sofa Mewah + Meja Kaca Bunga</text>
          <text x="120" y="227" fill="#fef08a" font-size="7" font-weight="bold" text-anchor="middle">⬆ MENGHADAP KE PANGGUNG</text>

          <!-- VVIP Kanan: Ketua PGRI -->
          <rect x="250" y="190" width="140" height="40" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" rx="4" />
          <text x="320" y="206" fill="#fde68a" font-size="8.5" font-weight="bold" text-anchor="middle">SOFA VVIP KETUA PGRI &amp; KADISDIK</text>
          <text x="320" y="217" fill="#fcd34d" font-size="7" text-anchor="middle">Sofa Mewah + Meja Kaca Bunga</text>
          <text x="320" y="227" fill="#fef08a" font-size="7" font-weight="bold" text-anchor="middle">⬆ MENGHADAP KE PANGGUNG</text>

          <!-- VIP Ring 2 -->
          <rect x="50" y="238" width="140" height="30" fill="#1e293b" stroke="#eab308" stroke-width="1" rx="2" />
          <text x="120" y="253" fill="#fef08a" font-size="8" text-anchor="middle">VIP PENGURUS PGRI &amp; KABID</text>
          <text x="120" y="262" fill="#fde047" font-size="6.5" font-weight="bold" text-anchor="middle">⬆ HADAP PANGGUNG</text>

          <rect x="250" y="238" width="140" height="30" fill="#1e293b" stroke="#eab308" stroke-width="1" rx="2" />
          <text x="320" y="253" fill="#fef08a" font-size="8" text-anchor="middle">VIP KEPALA SEKOLAH &amp; CAMAT</text>
          <text x="320" y="262" fill="#fde047" font-size="6.5" font-weight="bold" text-anchor="middle">⬆ HADAP PANGGUNG</text>

          <!-- ================= 4. BLOK KURSI GURU (LAPANGAN UTAMA) ================= -->
          <!-- Blok Kursi Kiri (Simetris &amp; Rapi Tanpa Halangan) -->
          <rect x="50" y="275" width="140" height="455" fill="url(#chairGrid)" stroke="#475569" stroke-width="1" rx="3" />
          <text x="120" y="520" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle">BLOK GURU KIRI</text>
          <text x="120" y="535" fill="#94a3b8" font-size="9" text-anchor="middle">± 900 Kursi (Korwil Barat)</text>

          <!-- Gang Melintang (Cross-Aisle) -->
          <line x1="40" y1="490" x2="400" y2="490" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4" />
          <text x="320" y="485" fill="#fbbf24" font-size="7.5" font-weight="bold" text-anchor="middle">GANG EVAKUASI / AKSES TOILET (LEBAR 2 M)</text>

          <!-- Blok Kursi Kanan -->
          <rect x="250" y="275" width="140" height="455" fill="url(#chairGrid)" stroke="#475569" stroke-width="1" rx="3" />
          <text x="320" y="520" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle">BLOK GURU KANAN</text>
          <text x="320" y="535" fill="#94a3b8" font-size="9" text-anchor="middle">± 900 Kursi (Korwil Timur)</text>

          <!-- ================= 6. JALAN GERBANG, TANJAK &amp; GERBANG SMAN 1 ================= -->
          <rect x="20" y="760" width="400" height="55" fill="#1e293b" stroke="#475569" stroke-width="1.5" rx="3" />
          <text x="220" y="792" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">JALAN GERBANG SMAN 1 BELITANG</text>

          <!-- Tanjak SMAN 1 Belitang -->
          <polygon points="20,785 45,750 70,785 55,810 35,810" fill="#b45309" stroke="#fbbf24" stroke-width="2" />
          <text x="45" y="825" fill="#fef08a" font-size="8.5" font-weight="bold" text-anchor="middle">TANJAK</text>
          <text x="45" y="835" fill="#fde047" font-size="7.5" text-anchor="middle">SMAN 1 BLT</text>

          <!-- Gerbang SMAN 1 Belitang -->
          <rect x="365" y="765" width="50" height="45" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2" rx="3" />
          <text x="390" y="788" fill="#dbeafe" font-size="8" font-weight="bold" text-anchor="middle">GERBANG</text>
          <text x="390" y="799" fill="#bfdbfe" font-size="7" text-anchor="middle">SMAN 1 BLT</text>
          <text x="390" y="825" fill="#38bdf8" font-size="7.5" font-weight="bold" text-anchor="middle">Pintu Masuk</text>

          <!-- Rute Prosesi Bupati -->
          <path d="M 390,760 L 390,740 L 220,740 L 220,230" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5" />
          <text x="270" y="732" fill="#f87171" font-size="8" font-weight="bold">RUTE PROSESI BUPATI</text>

          <!-- ================= 7. LAPANGAN ATAS / TRIBUN GURU BLOK BELAKANG ================= -->
          <rect x="20" y="850" width="400" height="150" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" rx="6" />
          <rect x="35" y="860" width="370" height="130" fill="url(#upperChairGrid)" stroke="#38bdf8" stroke-dasharray="2" rx="4" />
          
          <rect x="110" y="880" width="220" height="42" fill="#0b1120" opacity="0.95" rx="6" stroke="#0284c7" />
          <text x="220" y="898" fill="#38bdf8" font-size="11" font-weight="extrabold" text-anchor="middle">LAPANGAN ATAS / TRIBUN GURU</text>
          <text x="220" y="913" fill="#7dd3fc" font-size="8.5" text-anchor="middle">Kapasitas: 1.200 Kursi (Elevasi Tinggi / Pandangan Alami)</text>

          <!-- Delay Audio -->
          <circle cx="170" cy="850" r="5" fill="#f59e0b" />
          <text x="170" y="843" fill="#fbbf24" font-size="7" text-anchor="middle">Delay Audio</text>

          <circle cx="270" cy="850" r="5" fill="#f59e0b" />
          <text x="270" y="843" fill="#fbbf24" font-size="7" text-anchor="middle">Delay Audio</text>
        </svg>